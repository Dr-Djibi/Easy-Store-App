name: Build APK / AAB Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview pour APK direct)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
      platform:
        description: 'Plateforme cible'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  eas-build:
    name: EAS Android / Binary Build
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Trigger EAS Build (Génération APK)
        id: eas-build-step
        run: |
          PROFILE="${{ inputs.profile }}"
          [ -z "$PROFILE" ] && PROFILE="preview"
          PLATFORM="${{ inputs.platform }}"
          [ -z "$PLATFORM" ] && PLATFORM="android"
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
